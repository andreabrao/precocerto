name: Publicar frontend no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validar URL da API
        env:
          VITE_API_BASE_URL: ${{ vars.PRECOCERTO_API_BASE_URL || 'https://precocerto-curitiba-itaperucu.admdetoxorange.chatgpt.site' }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Configure PRECOCERTO_API_BASE_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Gerar frontend estatico
        env:
          VITE_API_BASE_URL: ${{ vars.PRECOCERTO_API_BASE_URL || 'https://precocerto-curitiba-itaperucu.admdetoxorange.chatgpt.site' }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run build:pages

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
