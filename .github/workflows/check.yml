name: Verificação (typecheck, build, testes, lint)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build e testes
        run: pnpm run test

      - name: Lint
        run: pnpm run lint
